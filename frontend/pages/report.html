<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Item</title><link rel="stylesheet" href="../css/style.css"></head>
<body><nav><a class="brand" href="../index.html">🔎 Smart Lost & Found</a><div id="nav"></div></nav>
<main class="auth"><div class="form-card wide"><h1>Report an item</h1><p>Provide clear details so others can identify it.</p>
<form id="reportForm" class="form-grid"><input id="name" placeholder="Item name" required><select id="type" required><option value="">Report type</option><option>LOST</option><option>FOUND</option></select><input id="category" placeholder="Category (e.g. Electronics)"><input id="date" type="date" required><input id="location" placeholder="Location" required><input id="contact" placeholder="Contact information" required><input id="imageUrl" placeholder="Image URL (optional)"><textarea id="description" placeholder="Description" required></textarea><button class="btn primary">Submit Report</button></form><p id="msg" class="msg"></p></div></main><script src="../js/report.js"></script></body></html>
