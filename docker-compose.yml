services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lost_found
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lost_found"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lost_found
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PORT: 8080
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres_data:
